name: Delete Sandbox Listings

on:
  workflow_dispatch:
    inputs:
      delete_all:
        description: "Type DELETE ALL to end every active fixed-price Sandbox listing"
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete all Sandbox listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          EBAY_ENVIRONMENT: sandbox
          DELETE_ALL: ${{ inputs.delete_all }}
        run: |
          python - <<'PY'
          import os
          from src.ebay import EbayClient

          confirmation = os.environ["DELETE_ALL"].strip()
          if confirmation != "DELETE ALL":
              raise SystemExit(
                  'Nothing was deleted. The confirmation must be exactly "DELETE ALL".'
              )

          client = EbayClient("sandbox")
          listings = client.get_active_offers()

          item_ids = []
          seen = set()
          for listing in listings:
              item_id = str(
                  listing.get("itemId")
                  or listing.get("offerId")
                  or listing.get("listing", {}).get("listingId")
                  or ""
              ).strip()
              if item_id and item_id not in seen:
                  seen.add(item_id)
                  item_ids.append(item_id)

          if not item_ids:
              print("No active fixed-price Sandbox listings found.")
              raise SystemExit(0)

          print(f"Found {len(item_ids)} active fixed-price Sandbox listing(s).")

          failures = []
          for item_id in item_ids:
              try:
                  client.delete_listing(item_id=item_id)
                  print(f"Deleted Sandbox listing {item_id}.")
              except Exception as error:
                  failures.append((item_id, str(error)))
                  print(f"FAILED to delete Sandbox listing {item_id}: {error}")

          if failures:
              print("\nListings that could not be deleted:")
              for item_id, error in failures:
                  print(f"  {item_id}: {error}")
              raise SystemExit(
                  f"{len(failures)} listing(s) could not be deleted."
              )

          print(f"Successfully deleted all {len(item_ids)} active Sandbox listing(s).")
          PY
